name: Migrate Benchmark Dates
on:
  workflow_dispatch:
permissions:
  contents: write
# Share the benchmark concurrency group so this cannot race with a bench
# push to gh-pages.
concurrency:
  group: benchmark
  cancel-in-progress: false
jobs:
  migrate:
    name: Migrate entry dates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - name: Clone gh-pages
        env:
          GH_TOKEN: ${{ secrets.BENCHMARK_TOKEN }}
        run: |
          set -euo pipefail
          git clone --branch gh-pages --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      - name: Migrate dev/bench
        run: |
          set -euo pipefail
          if [ -f gh-pages/dev/bench/data.js ]; then
            node scripts/bench/migrate-dates.mjs --data-file gh-pages/dev/bench/data.js
          else
            echo "gh-pages/dev/bench/data.js not found, skipping."
          fi
      - name: Migrate release/bench
        run: |
          set -euo pipefail
          if [ -f gh-pages/release/bench/data.js ]; then
            node scripts/bench/migrate-dates.mjs --data-file gh-pages/release/bench/data.js
          else
            echo "gh-pages/release/bench/data.js not found, skipping."
          fi
      - name: Commit and push
        working-directory: gh-pages
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes (already migrated, or no dashboards found)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage only files that exist; either dashboard may be absent
          # on a repo that has never produced one of the two trend lines.
          git add -u dev/bench/data.js release/bench/data.js 2>/dev/null || true
          git commit -m "chore(bench): migrate entry dates to commit timestamps"
          git push origin gh-pages
